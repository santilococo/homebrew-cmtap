name: Update homebrew formulas

on:
  # schedule:
  #   - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        formula:
          - cliphist

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Run livecheck
        id: check
        env:
          NAME: "${{ matrix.formula }}"
        run: |
          set -eux
          FILE="Formula/${NAME}.rb"
          brew trust "$GITHUB_REPOSITORY"
          brew tap "$GITHUB_REPOSITORY"
          json=$(brew livecheck --json "${NAME}")
          latest=$(echo "$json" | jq -r '.[0].version.latest')
          current=$(echo "$json" | jq -r '.[0].version.current')
          outdated=$(echo "$json" | jq -r '.[0].version.outdated')
          if [ "$outdated" != "true" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "up_to_date=false" >> $GITHUB_OUTPUT
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Update formula
        if: steps.check.outputs.up_to_date == 'false'
        env:
          NAME: "${{ matrix.formula }}"
          STEPS_CHECK_OUTPUTS_LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -eux
          FILE="Formula/${NAME}.rb"
          latest="${STEPS_CHECK_OUTPUTS_LATEST}"
          url_template=$(grep '^  url "' "$FILE" | sed -E 's/.*"(.*)".*/\1/')
          new_url=$(echo "$url_template" | sed "s/#{version}/$latest/g")
          sha=$(curl -L "$new_url" | sha256sum | awk '{print $1}')
          sed -i "s|^  version \".*\"|  version \"$latest\"|" "$FILE"
          sed -i "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$FILE"

      - name: Commit changes
        if: steps.check.outputs.up_to_date == 'false'
        env:
          NAME: "${{ matrix.formula }}"
          STEPS_CHECK_OUTPUTS_LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -eux
          git config --local user.name "$(git log --format=%an | head -n 1)"
          git config --local user.email "$(git log --format=%ae | head -n 1)"
          git add Formula/${NAME}.rb
          git commit -m "Update ${NAME} to ${STEPS_CHECK_OUTPUTS_LATEST}" || exit 0
          git push
